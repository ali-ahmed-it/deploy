<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATLAS</title>

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Map fills the entire background */
    #map {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      filter: brightness(0.75) saturate(1.2);
    }

    /* Purple-pink overlay on top of map */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, rgba(120,40,200,0.45), rgba(240,60,150,0.45));
      z-index: 1;
    }

    /* Card sits above everything */
    .wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(245, 245, 245, 0.92);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 40px 30px;
      width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 24px;
      color: #111;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      margin-bottom: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .add-row input {
      flex: 1;
      margin-bottom: 0;
    }

    button {
      padding: 14px 24px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #2563eb; }

    ul {
      list-style: none;
      margin-top: 20px;
    }

    ul li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f3f4f6;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    ul li.done span {
      text-decoration: line-through;
      color: #aaa;
    }

    .actions { display: flex; gap: 8px; }

    .btn-done {
      background: #22c55e;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .btn-done:hover { background: #16a34a; }

    .btn-del {
      background: #ef4444;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .btn-del:hover { background: #dc2626; }
  </style>
</head>
<body>

  <!-- World Map Background -->
  <div id="map"></div>

  <!-- Color Overlay -->
  <div class="overlay"></div>

  <!-- App Card -->
  <div class="wrapper">
    <div class="card">
      <h1>ATLAS 💥</h1>

      <input type="text" id="searchInput" placeholder="🔍 Search tasks..." oninput="searchTasks()" />

      <div class="add-row">
        <input type="text" id="taskInput" placeholder="📌 Add a new task..." />
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="taskList"></ul>
    </div>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── World Map Setup ──────────────────────────────────────
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      zoomControl: false,
      scrollWheelZoom: false,
      dragging: false,
      doubleClickZoom: false,
      attributionControl: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // ── ToDo Logic ───────────────────────────────────────────
    let tasks = [];

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = '';
      renderTasks();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      renderTasks();
    }

    function toggleDone(i) {
      tasks[i].done = !tasks[i].done;
      renderTasks();
    }

    function searchTasks() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderTasks(q);
    }

    function renderTasks(filter = '') {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, i) => {
        if (!task.text.toLowerCase().includes(filter)) return;
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');
        li.innerHTML = `
          <span>${task.text}</span>
          <div class="actions">
            <button class="btn-done" onclick="toggleDone(${i})">✔</button>
            <button class="btn-del" onclick="deleteTask(${i})">✖</button>
          </div>`;
        list.appendChild(li);
      });
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });
  </script>

</body>
</html>
