<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATLAS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:'Segoe UI',sans-serif; }
    canvas { display:block; cursor:grab; }
    canvas:active { cursor:grabbing; }

    #title {
      position:fixed; top:22px; left:50%; transform:translateX(-50%);
      font-size:3.6rem; font-weight:900; letter-spacing:0.45em;
      background:linear-gradient(135deg,#a5d8ff,#ffffff,#c3aeff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 18px rgba(130,200,255,0.8));
      pointer-events:none; z-index:10; white-space:nowrap;
    }

    #hint {
      position:fixed; top:96px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,0.38); font-size:0.73rem; letter-spacing:0.13em;
      pointer-events:none; z-index:10;
    }

    #loading {
      position:fixed; top:52%; left:50%; transform:translate(-50%,-50%);
      color:rgba(255,255,255,0.55); font-size:0.9rem; letter-spacing:0.15em;
      z-index:20; pointer-events:none;
    }

    #tooltip {
      position:fixed; pointer-events:none; z-index:30;
      background:rgba(5,5,20,0.88); color:#fff;
      padding:10px 20px; border-radius:12px;
      font-size:1rem; font-weight:700; letter-spacing:0.03em;
      border:1px solid rgba(244,114,182,0.55);
      box-shadow:0 0 24px rgba(244,114,182,0.25);
      display:none; white-space:nowrap;
      transform:translate(-50%, -140%);
      transition: opacity 0.15s;
    }
    #tooltip small {
      display:block; font-size:0.68rem; font-weight:400;
      opacity:0.6; margin-top:4px; letter-spacing:0.06em;
    }

    #legend {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      display:flex; gap:18px; background:rgba(0,0,0,0.5);
      backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08);
      border-radius:30px; padding:9px 22px; z-index:10; pointer-events:none;
    }
    .li { display:flex; align-items:center; gap:7px; font-size:0.74rem; color:rgba(255,255,255,0.78); }
    .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

    #credit {
      position:fixed; bottom:22px; left:28px;
      z-index:100; pointer-events:none;
      font-family:'Segoe UI',sans-serif;
      font-size:0.78rem; font-weight:400;
      letter-spacing:0.08em;
      color:rgba(255,255,255,0.45);
      line-height:1.7;
    }
    #credit span {
      font-weight:700; font-size:0.85rem; letter-spacing:0.12em;
      background:linear-gradient(135deg,#a5d8ff,#c3aeff,#f9a8d4);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      filter:drop-shadow(0 0 6px rgba(180,150,255,0.5));
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div id="title">✦ ATLAS</div>
<div id="hint">HOVER TO EXPLORE &nbsp;·&nbsp; CLICK TO OPEN WIKIPEDIA</div>
<div id="loading">⟳ Loading Earth textures...</div>
<div id="tooltip"></div>

<div id="legend">
  <div class="li"><div class="dot" style="background:#f472b6"></div>Country</div>
  <div class="li"><div class="dot" style="background:#38bdf8"></div>Ocean / Sea</div>
  <div class="li"><div class="dot" style="background:#34d399"></div>Lake</div>
  <div class="li"><div class="dot" style="background:#fbbf24"></div>Mountain Range</div>
</div>

<div id="credit">
  A project by
  <span>Ayesha</span>,
  <span>Hafsa</span>,
  <span>Maryem</span> &amp;
  <span>Khaula</span>
</div>

<script>
// ── Renderer & Scene ───────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 2.6);

// ── Stars ─────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starArr = new Float32Array(12000);
for (let i = 0; i < 12000; i++) starArr[i] = (Math.random() - 0.5) * 400;
starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.75 })));

// ── Globe Mesh ────────────────────────────────────────
const texLoader = new THREE.TextureLoader();
let texturesLoaded = 0;
function onTexLoad() { if (++texturesLoaded >= 2) document.getElementById('loading').style.display = 'none'; }

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 72, 72),
  new THREE.MeshPhongMaterial({
    map:         texLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', onTexLoad),
    bumpMap:     texLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png', onTexLoad),
    bumpScale:   0.055,
    specular:    new THREE.Color(0x1a3a5c),
    shininess:   18
  })
);
scene.add(globe);

// ── Atmosphere ────────────────────────────────────────
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.028, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x3388ff, transparent: true, opacity: 0.09 })
));
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.055, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x1155cc, transparent: true, opacity: 0.04, side: THREE.BackSide })
));

// ── Lighting ──────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.38));
const sun = new THREE.DirectionalLight(0xfff8e8, 1.5);
sun.position.set(5, 3, 5);
scene.add(sun);

// ── Geographic Features ───────────────────────────────
const FEATURES = [
  { name:'Pacific Ocean',     lat:0,    lng:-160, type:'ocean',    emoji:'🌊', wiki:'Pacific_Ocean',     r:28 },
  { name:'Atlantic Ocean',    lat:10,   lng:-30,  type:'ocean',    emoji:'🌊', wiki:'Atlantic_Ocean',    r:26 },
  { name:'Indian Ocean',      lat:-20,  lng:80,   type:'ocean',    emoji:'🌊', wiki:'Indian_Ocean',      r:26 },
  { name:'Arctic Ocean',      lat:83,   lng:0,    type:'ocean',    emoji:'🌊', wiki:'Arctic_Ocean',      r:20 },
  { name:'Southern Ocean',    lat:-68,  lng:0,    type:'ocean',    emoji:'🌊', wiki:'Southern_Ocean',    r:20 },
  { name:'Mediterranean Sea', lat:36,   lng:15,   type:'sea',      emoji:'🌊', wiki:'Mediterranean_Sea', r:12 },
  { name:'Caribbean Sea',     lat:15,   lng:-75,  type:'sea',      emoji:'🌊', wiki:'Caribbean_Sea',     r:12 },
  { name:'South China Sea',   lat:12,   lng:114,  type:'sea',      emoji:'🌊', wiki:'South_China_Sea',   r:12 },
  { name:'Arabian Sea',       lat:16,   lng:64,   type:'sea',      emoji:'🌊', wiki:'Arabian_Sea',       r:12 },
  { name:'Red Sea',           lat:20,   lng:38,   type:'sea',      emoji:'🌊', wiki:'Red_Sea',           r:9  },
  { name:'Black Sea',         lat:43,   lng:33,   type:'sea',      emoji:'🌊', wiki:'Black_Sea',         r:8  },
  { name:'North Sea',         lat:56,   lng:4,    type:'sea',      emoji:'🌊', wiki:'North_Sea',         r:8  },
  { name:'Persian Gulf',      lat:26,   lng:52,   type:'sea',      emoji:'🌊', wiki:'Persian_Gulf',      r:8  },
  { name:'Caspian Sea',       lat:42,   lng:51,   type:'sea',      emoji:'🌊', wiki:'Caspian_Sea',       r:7  },
  { name:'Bay of Bengal',     lat:15,   lng:89,   type:'sea',      emoji:'🌊', wiki:'Bay_of_Bengal',     r:10 },
  { name:'Lake Superior',     lat:47,   lng:-85,  type:'lake',     emoji:'🏞️', wiki:'Lake_Superior',     r:6  },
  { name:'Lake Victoria',     lat:-1,   lng:33,   type:'lake',     emoji:'🏞️', wiki:'Lake_Victoria',     r:5  },
  { name:'Lake Baikal',       lat:53,   lng:108,  type:'lake',     emoji:'🏞️', wiki:'Lake_Baikal',       r:5  },
  { name:'Lake Tanganyika',   lat:-6,   lng:29,   type:'lake',     emoji:'🏞️', wiki:'Lake_Tanganyika',   r:5  },
  { name:'Lake Michigan',     lat:44,   lng:-87,  type:'lake',     emoji:'🏞️', wiki:'Lake_Michigan',     r:5  },
  { name:'Himalayas',         lat:28,   lng:84,   type:'mountain', emoji:'⛰️', wiki:'Himalayas',         r:8  },
  { name:'Andes',             lat:-20,  lng:-68,  type:'mountain', emoji:'⛰️', wiki:'Andes',             r:8  },
  { name:'Alps',              lat:46,   lng:9,    type:'mountain', emoji:'⛰️', wiki:'Alps',              r:6  },
  { name:'Rocky Mountains',   lat:45,   lng:-110, type:'mountain', emoji:'⛰️', wiki:'Rocky_Mountains',   r:8  },
  { name:'Atlas Mountains',   lat:32,   lng:-4,   type:'mountain', emoji:'⛰️', wiki:'Atlas_Mountains',   r:7  },
  { name:'Caucasus',          lat:42,   lng:44,   type:'mountain', emoji:'⛰️', wiki:'Caucasus',          r:6  },
  { name:'Karakoram',         lat:36,   lng:76,   type:'mountain', emoji:'⛰️', wiki:'Karakoram',         r:6  },
  { name:'Appalachians',      lat:38,   lng:-80,  type:'mountain', emoji:'⛰️', wiki:'Appalachian_Mountains', r:7 },
];

const TYPE_COLOR = { ocean:'#38bdf8', sea:'#7dd3fc', lake:'#34d399', mountain:'#fbbf24' };
const TYPE_SIZE  = { ocean:'0.82rem', sea:'0.70rem', lake:'0.62rem', mountain:'0.62rem' };

function ll2v(lat, lng) {
  const phi = lat * Math.PI / 180;
  const tht = lng * Math.PI / 180;
  return new THREE.Vector3(Math.cos(phi) * Math.cos(tht), Math.sin(phi), -Math.cos(phi) * Math.sin(tht));
}

function hitLL(worldPt) {
  const v = globe.worldToLocal(worldPt.clone()).normalize();
  return {
    lat: Math.asin(Math.max(-1, Math.min(1, v.y))) * 180 / Math.PI,
    lng: Math.atan2(-v.z, v.x) * 180 / Math.PI
  };
}

function gcDeg(la1, ln1, la2, ln2) {
  const R = Math.PI / 180;
  const dLa = (la2 - la1) * R, dLn = (ln2 - ln1) * R;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*R)*Math.cos(la2*R)*Math.sin(dLn/2)**2;
  return 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) / R;
}

function nearest(lat, lng) {
  let best = null, bd = Infinity;
  for (const f of FEATURES) {
    const d = gcDeg(lat, lng, f.lat, f.lng);
    if (d < f.r && d < bd) { best = f; bd = d; }
  }
  return best;
}

// ── HTML Label Overlays ───────────────────────────────
FEATURES.forEach(f => {
  const el = document.createElement('div');
  el.style.cssText = `
    position:fixed; z-index:5; pointer-events:auto; cursor:pointer;
    font-family:'Segoe UI',sans-serif; font-weight:700;
    font-size:${TYPE_SIZE[f.type]}; color:${TYPE_COLOR[f.type]};
    text-shadow:0 0 6px ${TYPE_COLOR[f.type]},0 0 14px #000028;
    white-space:nowrap; transform:translate(-50%,-50%);
    display:none; letter-spacing:0.02em;
  `;
  el.textContent = f.name;
  el.addEventListener('mouseenter', () => showTip(f.name, f.emoji, TYPE_COLOR[f.type]));
  el.addEventListener('mouseleave', hideTip);
  el.addEventListener('click', () => window.open(`https://en.wikipedia.org/wiki/${f.wiki}`, '_blank'));
  document.body.appendChild(el);
  f.el = el;
  f.localV = ll2v(f.lat, f.lng);
});

// ── Tooltip ───────────────────────────────────────────
const tipEl = document.getElementById('tooltip');
let tipX = 0, tipY = 0;

function showTip(name, emoji, color, x, y) {
  tipEl.innerHTML = `${emoji} ${name}<small>Click to open Wikipedia</small>`;
  tipEl.style.borderColor = color;
  tipEl.style.display = 'block';
  if (x !== undefined) { tipX = x; tipY = y; }
  tipEl.style.left = tipX + 'px';
  tipEl.style.top  = tipY + 'px';
}

function hideTip() { tipEl.style.display = 'none'; }

// ── Mouse / Drag / Rotate ─────────────────────────────
let dragging = false, lastX = 0, lastY = 0;
let velX = 0, velY = 0;
let autoSpin = true;

window.addEventListener('mousedown', e => {
  dragging = true; autoSpin = false;
  lastX = e.clientX; lastY = e.clientY;
  velX = 0; velY = 0;
  hideTip(); clearTimeout(gcTimer);
});

window.addEventListener('mouseup', () => { dragging = false; });

window.addEventListener('mousemove', e => {
  if (dragging) {
    velY = (e.clientX - lastX) * 0.006;
    velX = (e.clientY - lastY) * 0.004;
    globe.rotation.y += velY;
    globe.rotation.x += velX;
    globe.rotation.x = Math.max(-1.2, Math.min(1.2, globe.rotation.x));
    lastX = e.clientX; lastY = e.clientY;
    return;
  }

  tipX = e.clientX; tipY = e.clientY;

  mouse.x = (e.clientX / window.innerWidth)  *  2 - 1;
  mouse.y = (e.clientY / window.innerHeight) * -2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(globe);

  if (hits.length) {
    document.getElementById('c').style.cursor = 'pointer';
    const { lat, lng } = hitLL(hits[0].point);
    const feat = nearest(lat, lng);
    if (feat) {
      clearTimeout(gcTimer);
      showTip(feat.name, feat.emoji, TYPE_COLOR[feat.type], e.clientX, e.clientY);
    } else {
      reverseGeo(lat, lng, e.clientX, e.clientY);
    }
  } else {
    document.getElementById('c').style.cursor = 'grab';
    clearTimeout(gcTimer);
    hideTip();
  }
});

window.addEventListener('wheel', e => {
  camera.position.z = Math.max(1.4, Math.min(5, camera.position.z + e.deltaY * 0.003));
});

window.addEventListener('click', e => {
  if (Math.abs(e.clientX - lastX) > 4 || Math.abs(e.clientY - lastY) > 4) return;
  mouse.x = (e.clientX / window.innerWidth)  *  2 - 1;
  mouse.y = (e.clientY / window.innerHeight) * -2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(globe);
  if (!hits.length) return;

  const { lat, lng } = hitLL(hits[0].point);
  const feat = nearest(lat, lng);
  if (feat) { window.open(`https://en.wikipedia.org/wiki/${feat.wiki}`, '_blank'); return; }

  fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
    .then(r => r.json())
    .then(d => {
      const name = d.countryName;
      if (name) window.open(`https://en.wikipedia.org/wiki/${name.replace(/ /g,'_')}`, '_blank');
    }).catch(() => {});
});

// ── Reverse Geocode ───────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let gcTimer = null;

function reverseGeo(lat, lng, x, y) {
  clearTimeout(gcTimer);
  gcTimer = setTimeout(() => {
    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
      .then(r => r.json())
      .then(d => {
        if (d.countryName) showTip(d.countryName, '🌍', 'rgba(244,114,182,0.9)', x, y);
        else hideTip();
      }).catch(() => {});
  }, 180);
}

// ── Project labels each frame ─────────────────────────
const tempV = new THREE.Vector3();

function updateLabels() {
  FEATURES.forEach(f => {
    tempV.copy(f.localV).applyEuler(globe.rotation);
    const dot = tempV.dot(camera.position.clone().normalize());
    if (dot < 0.15) { f.el.style.display = 'none'; return; }
    const proj = tempV.clone().project(camera);
    const sx = ( proj.x + 1) / 2 * window.innerWidth;
    const sy = (-proj.y + 1) / 2 * window.innerHeight;
    f.el.style.display = 'block';
    f.el.style.left = sx + 'px';
    f.el.style.top  = sy + 'px';
    f.el.style.opacity = Math.min(1, (dot - 0.15) * 5).toFixed(2);
  });
}

// ── Animate ───────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  if (autoSpin) {
    globe.rotation.y += 0.0018;
  } else if (!dragging) {
    velY *= 0.94; velX *= 0.94;
    globe.rotation.y += velY;
    globe.rotation.x += velX;
    if (Math.abs(velX) < 0.0001 && Math.abs(velY) < 0.0001) autoSpin = true;
  }
  updateLabels();
  renderer.render(scene, camera);
})();

// ── Resize ────────────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
